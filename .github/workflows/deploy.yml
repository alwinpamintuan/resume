name: Validate and deploy résumé

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: resume
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alwinpamintuan/alwinpamintuan.github.io
          ref: main
          path: hub
          persist-credentials: false
      - name: Record tested revisions
        run: |
          git -C hub rev-parse HEAD
          git -C resume rev-parse HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            hub/package-lock.json
            resume/package-lock.json
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
        working-directory: hub
      - run: npm ci
        working-directory: resume
      - run: npx playwright install --with-deps chromium
        working-directory: hub
      - run: npx playwright install --with-deps chromium
        working-directory: resume
      - run: npm run build
        working-directory: hub
      - run: npm run build
        working-directory: resume
      - name: Verify candidate behavior
        run: npm run test:e2e
        working-directory: resume
      - name: Verify both production builds together
        run: npm run test:integration
        working-directory: hub
        env:
          COMPANION_DIST: ${{ github.workspace }}/resume/dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: resume/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
