work:
  - id: reliable-ingestion
    title: Reliable by design
    summary: An incremental ingestion platform with predictable freshness and a clear path to recovery.
    placement: selected
    type: Production platform
    year: "2026"
    slug: reliable-ingestion
    technologies: [Python, Airflow, PostgreSQL, Snowflake]
    details:
      problem: Overnight ingestion made operational decisions depend on yesterday's data. Failed batches required manual investigation and reruns.
      contribution: I designed incremental ingestion with source checkpoints, idempotent writes, and explicit freshness checks. I owned the implementation and recovery runbooks within a three-person team.
      tradeoff: Six-hour batches met the business requirement without the infrastructure and operational burden of continuous streaming.
      outcome: Freshness improved from 24 hours to six hours, with replayable backfills and documented recovery for each source. These are fictional sample results.
      pipeline:
        label: From source to trusted data
        nodes: [Source systems, Validated ingestion, Trusted warehouse]
        caption: Checkpoints and replayable loads keep failures recoverable; freshness checks make delivery visible.
  - id: warehouse-efficiency
    title: Less compute. Same answers.
    summary: Incremental models and workload tuning that reduced warehouse cost by 32% while preserving reporting freshness.
    placement: selected
    type: Warehouse optimization
    year: "2025"
    technologies: [SQL, dbt, Snowflake]
  - id: schema-notes
    title: Schema Notes
    summary: A small browser tool for comparing schemas and making changes easier to review.
    placement: other
    type: Independent experiment
    year: "2026"
    slug: schema-notes
    technologies: [TypeScript, JSON, CSS]
    details:
      problem: Small schema changes are easy to miss when reviewing large JSON files.
      contribution: Built a prototype that groups additions, removals, and type changes into a compact comparison. This page illustrates how to showcase a future tool; no live app is included.
      tradeoff: Kept processing local to the browser and limited the prototype to flat schemas to make the initial behavior easy to understand.
      outcome: A focused interface for reviewing changes before integrating them into downstream models. Fictional demonstration project.
      screenshot:
        src: /images/schema-notes.svg
        alt: Illustrative Schema Notes interface showing two added fields and one changed type; this is a mockup, not a running app.

